<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Max</title>
    <script src="/static/main.js" defer></script> <!-- Link your JavaScript file -->
    <link rel="stylesheet" href="/static/main.css"> <!-- Optional for CSS styling -->
</head>
<body>
    <h1>Welcome to Movie Max</h1>
    
    <!-- Login Section -->
    <section id="login-section">
        <h2>Login</h2>
        <form id="login-form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Login</button>
        </form>
        <div id="login-message"></div>
    </section>
    
    <!-- Search Movie Section -->
    <section id="search-section">
        <h2>Search Movie</h2>
        <form id="search-form">
            <label for="query">Movie Title:</label>
            <input type="text" id="query" name="query" required>
            <button type="submit">Search</button>
        </form>
        <div id="search-results"></div>
    </section>
    
    <!-- Movie Recommendations Section -->
    <section id="recommendations-section">
        <h2>Get Recommendations</h2>
        <form id="recommendations-form">
            <label for="movie-id">Movie ID:</label>
            <input type="number" id="movie-id" name="movie-id" required>
            <button type="submit">Get Recommendations</button>
        </form>
        <div id="recommendations-results"></div>
    </section>
</body>
</html>
